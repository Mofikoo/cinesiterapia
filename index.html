<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kiné Révision</title>
  <meta name="description" content="Fiches de révision des palpations et mobilisations de kinésithérapie">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <a class="back-btn" href="#/" hidden><span aria-hidden="true">←</span> <span data-i18n="home">Accueil</span></a>
    <a class="brand" href="#/">
      <h1 data-i18n="appTitle">Kiné Révision</h1>
      <p class="sub" data-i18n="appSub"></p>
    </a>
    <div class="lang-switch" role="group" data-i18n-aria="language">
      <span class="lang-label" data-i18n="languageLabel">Langue :</span>
      <button type="button" class="lang-btn" data-lang="fr" lang="fr" aria-label="Français"><span class="long">Français</span><span class="short">FR</span></button>
      <button type="button" class="lang-btn" data-lang="es" lang="es" aria-label="Español"><span class="long">Español</span><span class="short">ES</span></button>
      <button type="button" class="lang-btn" data-lang="en" lang="en" aria-label="English"><span class="long">English</span><span class="short">EN</span></button>
    </div>
  </header>

  <main id="view-home" class="home" hidden>
    <a class="mode" href="#/reviser">
      <span class="mode-icon" aria-hidden="true">📖</span>
      <h2 data-i18n="modeReview">Réviser</h2>
      <p data-i18n="modeReviewDesc"></p>
    </a>
    <a class="mode" href="#/test">
      <span class="mode-icon" aria-hidden="true">🎴</span>
      <h2 data-i18n="modeTest">Se tester</h2>
      <p data-i18n="modeTestDesc"></p>
    </a>
  </main>

  <main id="view-review" hidden>
    <div class="filters">
      <button type="button" class="filter-toggle" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
        <span class="filter-current"></span>
      </button>
      <nav class="tabs" aria-label="Thèmes"></nav>
    </div>
    <div class="toolbar">
      <input type="search" id="search" class="search" data-i18n-ph="search">
      <span class="count" id="count"></span>
    </div>
    <div id="grid" class="grid"></div>
  </main>

  <main id="view-test" hidden>
    <div class="filters">
      <button type="button" class="filter-toggle" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
        <span class="filter-current"></span>
      </button>
      <nav class="tabs" aria-label="Thèmes"></nav>
    </div>
    <div class="test-zone">
      <p class="progress" id="progress"></p>
      <div id="flashcard" class="flashcard" role="button" tabindex="0"></div>
      <div class="test-actions">
        <button type="button" class="btn ghost" id="shuffle-btn" data-i18n="shuffle">Mélanger</button>
        <button type="button" class="btn" id="next-btn" data-i18n="next">Suivante</button>
      </div>
    </div>
  </main>

  <dialog id="detail" class="modal">
    <form method="dialog" class="close-row"><button class="icon-btn" value="close" data-i18n-aria="close">✕</button></form>
    <article id="detail-body"></article>
  </dialog>

  <footer class="foot" data-i18n="footer"></footer>

  <script src="js/helpers.js"></script>
  <script src="js/data-p1.js"></script>
  <script src="js/data-p2.js"></script>
  <script src="js/data-p3.js"></script>
  <script src="js/data-p6.js"></script>
  <script src="js/muscles.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
