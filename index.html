<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kiné Révision</title>
  <meta name="description" content="Fiches de révision des palpations et mobilisations de kinésithérapie">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1 data-i18n="appTitle">Kiné Révision</h1>
      <p class="sub" data-i18n="appSub"></p>
    </div>
    <button class="icon-btn" id="settings-btn" type="button" aria-haspopup="dialog" data-i18n-aria="settings">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6a.5.5 0 0 0 .1-.6l-2-3.5a.5.5 0 0 0-.6-.2l-2.5 1a7.3 7.3 0 0 0-1.7-1l-.4-2.6a.5.5 0 0 0-.5-.4h-4a.5.5 0 0 0-.5.4l-.4 2.6a7.3 7.3 0 0 0-1.7 1l-2.5-1a.5.5 0 0 0-.6.2l-2 3.5a.5.5 0 0 0 .1.6L4.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6a.5.5 0 0 0-.1.6l2 3.5c.1.2.4.3.6.2l2.5-1c.5.4 1.1.7 1.7 1l.4 2.6c0 .2.2.4.5.4h4c.3 0 .5-.2.5-.4l.4-2.6c.6-.3 1.2-.6 1.7-1l2.5 1c.2.1.5 0 .6-.2l2-3.5a.5.5 0 0 0-.1-.6L19.4 13ZM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z"/></svg>
    </button>
  </header>

  <nav class="tabs" id="tabs" aria-label="Practices"></nav>

  <div class="toolbar">
    <input type="search" id="search" class="search" data-i18n-ph="search">
    <span class="count" id="count"></span>
  </div>

  <main id="grid" class="grid"></main>

  <dialog id="settings" class="modal small">
    <form method="dialog">
      <h2 data-i18n="settings">Réglages</h2>
      <fieldset>
        <legend data-i18n="language">Langue</legend>
        <label><input type="radio" name="lang" value="fr"> Français</label>
        <label><input type="radio" name="lang" value="en"> English</label>
        <label><input type="radio" name="lang" value="es"> Español</label>
      </fieldset>
      <button class="btn" value="close" data-i18n="close">Fermer</button>
    </form>
  </dialog>

  <dialog id="detail" class="modal">
    <form method="dialog" class="close-row"><button class="icon-btn" value="close" data-i18n-aria="close">✕</button></form>
    <article id="detail-body"></article>
  </dialog>

  <footer class="foot" data-i18n="footer"></footer>

  <script src="js/helpers.js"></script>
  <script src="js/data-p1.js"></script>
  <script src="js/data-p2.js"></script>
  <script src="js/data-p3.js"></script>
  <script src="js/data-p6.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
